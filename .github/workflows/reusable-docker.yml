---
name: Docker Build and Push

on:
  workflow_call:
    inputs:
      image_name:
        default: false
        type: string

      image_tag:
        default: false
        type: string

    outputs:
      image_url:
        description: "Full Docker image path"
        value: ${{ jobs.build-push.outputs.image_url }}

jobs:
  build-push:
    runs-on: ubuntu-latest

    outputs:
      image_url: ${{ steps.image.outputs.image_url }}

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push to DockerHub
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/Three-tier-restaurant-app:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/Three-tier-restaurant-app:latest

      - name: Set Image URL
        id: image
        run: |
          echo "image_url=${{ secrets.DOCKER_USERNAME }}/Three-tier-restaurant-app:${{ github.sha }}" >> "$GITHUB_OUTPUT"
