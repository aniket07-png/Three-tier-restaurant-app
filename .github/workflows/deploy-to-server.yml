---
name: Deploy to Server

on:
    workflow_call:

jobs:
    deploy:
        runs-on: ubuntu-latest
        env:
            DOCKERHUB_USER: ${{ secrets.DOCKER_USERNAME }}
            DOCKERHUB_TAG: latest

        steps:
            - name: Code Checkout
              uses: actions/checkout@v4

            - name: SSH to prod server and create app folder
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.EC2_SSH_HOST }}
                  username: ${{ secrets.EC2_SSH_USER }}
                  key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
                  script: |
                      echo "Installing required packages and folder"
                      sudo apt-get update
                      sudo apt-get install docker.io docker-compose-v2 -y
                      sudo usermod -aG docker $USER
                      mkdir -p devops

            - name: Copy the docker compose file
              uses: appleboy/scp-action@v1
              with:
                  host: ${{ secrets.EC2_SSH_HOST }}
                  username: ${{ secrets.EC2_SSH_USER }}
                  key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
                  source: docker-compose.yml
                  target: ~/devops

            - name: SSH to prod server and run the app
              uses: appleboy/ssh-action@v1.0.3
              with:
                host: ${{ secrets.EC2_SSH_HOST }}
                username: ${{ secrets.EC2_SSH_USER }}
                key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
                script: |
                    echo "Running App"
                    export DOCKERHUB_USER=${{ secrets.DOCKER_USERNAME }}
                    export DOCKERHUB_TAG=latest
                    echo "${{ secrets.DOCKER_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
                    docker compose up -d --force-recreate --pull always
                    
