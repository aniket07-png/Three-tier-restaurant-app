---
name: Build and Test
on:
  workflow_call:
    inputs:
      run_test:
        default: true
        type: boolean
        
      node-version:
        default: '20.x'
        type: string

jobs:
  lint:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix: 
        os:
          - ubuntu-latest
          - macos-latest
        node-version:
          - 20.x
          - 22.x

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
         node-version: ${{ matrix.node-version }} # Specify your version here (e.g., 18, 20, 22)

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm install

    #  - name: Run Linter
     #   working-directory: ./frontend
    #    run: npm run lint # Make sure "lint" is configured in your package.json

  # 2. SECURITY SCANNING JOB (SAST)
  sast:
    name: SAST Security Scan
    runs-on: ubuntu-latest
    needs: lint # Only run security scans if code passes linting
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run SAST
        uses: semgrep/semgrep-action@v1
        with:
          config: p/javascript # Curated security rulesets for Node.js/JavaScript

  # 3. AUTOMATED TESTING JOB
  test:
    name: Unit Testing (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: sast
    if: ${{ inputs.run_test }}

    strategy:
      matrix:
        node-version:
          - 20.x
          - 22.x

    outputs:
      test_result: ${{ steps.test_result.outputs.test_result }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install Dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Run Test Suite
      id: run_tests
      continue-on-error: true
      working-directory: ./frontend
      run: npm test

    - name: Set Test Result
      id: test_result
      run: |
        if [ "${{ steps.run_tests.outcome }}" = "success" ]; then
          echo "test_result=passed" >> "$GITHUB_OUTPUT"
        else
          echo "test_result=failed" >> "$GITHUB_OUTPUT"
        fi

 #   - name: Fail Job If Tests Failed
 #     if: ${{ steps.run_tests.outcome == 'failure' }}
 #     run: exit 1
