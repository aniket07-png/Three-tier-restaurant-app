services:

  frontend:
    image: ${DOCKER_USERNAME}/three-tier-app:latest
    container_name: frontend_con
    ports:
      - "80:80"
    restart: always
    depends_on:
      - backend

  backend:
    build: ./backend
    container_name: backend_con
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://database:27017/restaurant_db
    restart: always
    depends_on:
      database:
        condition: service_healthy

  database:
    image: mongo:7.0
    container_name: mongo_db
    volumes:
      - mongo-data:/data/db
    restart: always
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  mongo-data:
